name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publishes the coverage report+badge to the wiki

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod requires Go 1.26 (bumped to clear stdlib CVEs flagged by
        # Snyk against older toolchain versions). Single version in the
        # matrix until 1.27 ships.
        go: ['1.26']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt diff in: $out"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: upload coverage artifact
        if: matrix.go == '1.26'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      # Publishes coverage.html + coverage.svg to the repo's wiki. The
      # wiki is auto-initialized on first run. No third-party service.
      # PRs get a comment with the coverage diff; main commits update
      # the badge served from the wiki.
      - name: coverage report (wiki + PR comment)
        if: matrix.go == '1.26' && github.event_name != 'workflow_dispatch'
        uses: ncruces/go-coverage-report@v0
        with:
          coverage-file: coverage.out
          report: true
          chart: true
          amend: true
        continue-on-error: true

  build:
    name: xcaddy build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: install xcaddy
        # Pinned to match Dockerfile so CI verifies the same xcaddy that
        # ships in the published image.
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.5

      - name: xcaddy build with local plugin
        run: |
          xcaddy build \
            --with github.com/mhupfauer/caddy-md4agents=. \
            --output ./caddy

      - name: verify plugin registered
        run: |
          ./caddy version
          ./caddy list-modules | grep '^http.handlers.markdown_for_agents$'
