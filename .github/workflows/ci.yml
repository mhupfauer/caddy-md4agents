name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod requires Go 1.25 (transitively via caddy/v2). Test the
        # minimum and the current stable. Older Go versions fail at
        # `go vet` with "go.mod requires go >= 1.25.0".
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt diff in: $out"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: upload coverage artifact
        if: matrix.go == '1.26'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: upload coverage to Codecov
        if: matrix.go == '1.26'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: xcaddy build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: xcaddy build with local plugin
        run: |
          xcaddy build \
            --with github.com/mhupfauer/caddy-md4agents=. \
            --output ./caddy

      - name: verify plugin registered
        run: |
          ./caddy version
          ./caddy list-modules | grep '^http.handlers.markdown_for_agents$'
