name: snyk

# Snyk SAST (Code), SCA (Open Source), IaC, and Container scans. SARIF
# from Snyk Code is uploaded to GitHub Code Scanning. To activate:
#
#   1. Create a free Snyk account at https://snyk.io
#   2. Get an API token (Account Settings → General → Auth Token)
#   3. Add it as repo secret `SNYK_TOKEN` (Settings → Secrets → Actions)
#
# The workflow detects a missing token and skips with a no-op so PRs
# from forks (and the initial setup window) don't fail noisily.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 07:23 UTC — catches new advisories on unchanged deps.
    - cron: '23 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          TOKEN_PRESENT: ${{ secrets.SNYK_TOKEN != '' }}
        run: echo "has_token=${TOKEN_PRESENT}" >> "${GITHUB_OUTPUT}"

  snyk:
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      IMAGE: caddy-md4agents:snyk
    steps:
      - uses: actions/checkout@v6

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # All four scan steps tolerate non-zero exit codes — `snyk test`
      # returns 1 whenever it finds anything, and we want the SARIF, not
      # a failed job. Real failures (auth, network, missing tool) still
      # surface via the upload step's missing-file error.

      - name: Snyk Code (SAST)
        run: snyk code test --sarif-file-output=snyk-code.sarif || true

      - name: Snyk Open Source (SCA)
        run: snyk test --all-projects --sarif-file-output=snyk-oss.sarif || true

      - name: Snyk IaC
        run: snyk iac test --sarif-file-output=snyk-iac.sarif . || true

      - name: Build local image for container scan
        run: docker build -t "$IMAGE" .

      - name: Snyk Container
        run: snyk container test "$IMAGE" --file=Dockerfile --sarif-file-output=snyk-container.sarif || true

      # Snyk also keeps a dashboard view at app.snyk.io; push a snapshot
      # of each so historical drift is visible there too. `monitor` is
      # fire-and-forget and shouldn't fail the workflow.
      - name: Snyk dashboard snapshots
        run: |
          snyk monitor --all-projects || true
          snyk container monitor "$IMAGE" --file=Dockerfile || true

      # Each SARIF gets its own `category` so GitHub Code Scanning shows
      # them as independent tool runs and doesn't dedupe across them.
      - name: Upload Snyk Code SARIF
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk OSS (SCA) SARIF
        if: always() && hashFiles('snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - name: Upload Snyk IaC SARIF
        if: always() && hashFiles('snyk-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      - name: Upload Snyk Container SARIF
        if: always() && hashFiles('snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
