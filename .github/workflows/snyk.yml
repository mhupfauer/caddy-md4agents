name: snyk

# Snyk SAST (Code), SCA (Open Source), IaC, and Container scans. SARIF
# from Snyk Code is uploaded to GitHub Code Scanning. To activate:
#
#   1. Create a free Snyk account at https://snyk.io
#   2. Get an API token (Account Settings → General → Auth Token)
#   3. Add it as repo secret `SNYK_TOKEN` (Settings → Secrets → Actions)
#
# The workflow detects a missing token and skips with a no-op so PRs
# from forks (and the initial setup window) don't fail noisily.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 07:23 UTC — catches new advisories on unchanged deps.
    - cron: '23 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          TOKEN_PRESENT: ${{ secrets.SNYK_TOKEN != '' }}
        run: echo "has_token=${TOKEN_PRESENT}" >> "${GITHUB_OUTPUT}"

  snyk:
    needs: preflight
    if: needs.preflight.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      IMAGE: caddy-md4agents:snyk
    steps:
      - uses: actions/checkout@v7

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@8e119fbb6c251787721d34ba683ed48eba792766

      # All four scan steps tolerate non-zero exit codes — `snyk test`
      # returns 1 whenever it finds anything, and we want the SARIF, not
      # a failed job. Real failures (auth, network, missing tool) still
      # surface via the upload step's missing-file error.

      # All scan steps tolerate non-zero exit codes — `snyk test`
      # returns 1 whenever it finds anything, and we want the SARIF.
      # If Snyk's API is temporarily down (SNYK-9999), no SARIF gets
      # written and the matching upload step is skipped via hashFiles.
      #
      # IaC scan is intentionally omitted: this repo has no Terraform /
      # k8s / CloudFormation files; the CLI fails with SNYK-CLI-0012.

      - name: Snyk Code (SAST)
        run: snyk code test --sarif-file-output=snyk-code.sarif || true

      - name: Snyk Open Source (SCA)
        run: snyk test --all-projects --sarif-file-output=snyk-oss.sarif || true

      - name: Build local image for container scan
        run: docker build -t "$IMAGE" .

      - name: Snyk Container
        run: snyk container test "$IMAGE" --file=Dockerfile --sarif-file-output=snyk-container.sarif || true

      # Snyk container SARIF sometimes lists rules with a null
      # `security-severity` property. GitHub Code Scanning's SARIF
      # validator rejects the whole file with "invalid security
      # severity value, is not a number: null". Patch null → "0" so
      # the file is accepted; the per-rule severity in `level` is
      # preserved either way.
      - name: Patch null security-severity in container SARIF
        if: hashFiles('snyk-container.sarif') != ''
        run: |
          # Snyk container emits `"security-severity": "null"` (a
          # four-character string, NOT JSON null) when an advisory
          # has no CVSS score. GitHub Code Scanning's SARIF validator
          # rejects the entire file with "is not a number: null".
          # Walk every object and rewrite both forms (JSON null and
          # the literal "null") to "0". `level` carries the
          # per-finding severity classification independently.
          jq 'walk(
                if type == "object" and has("security-severity")
                   and (.["security-severity"] == null or .["security-severity"] == "null")
                then .["security-severity"] = "0"
                else .
                end
              )' snyk-container.sarif > snyk-container.fixed.sarif
          mv snyk-container.fixed.sarif snyk-container.sarif
          bad=$(jq '[.. | objects | select(has("security-severity"))
                       | .["security-severity"]]
                     | map(select(. == null or . == "null")) | length' \
                    snyk-container.sarif)
          echo "remaining bad security-severity values: $bad"

      # Push a dashboard snapshot in parallel so app.snyk.io stays
      # current too. Fire-and-forget; never fails the workflow.
      - name: Snyk dashboard snapshots
        run: |
          snyk monitor --all-projects || true
          snyk container monitor "$IMAGE" --file=Dockerfile || true

      # Each SARIF gets its own `category` so GitHub Code Scanning
      # shows them as independent tool runs and doesn't dedupe across.
      - name: Upload Snyk Code SARIF
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk OSS (SCA) SARIF
        if: always() && hashFiles('snyk-oss.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - name: Archive container SARIF for inspection
        if: always() && hashFiles('snyk-container.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: snyk-container-sarif
          path: snyk-container.sarif
          retention-days: 3

      - name: Upload Snyk Container SARIF
        if: always() && hashFiles('snyk-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
